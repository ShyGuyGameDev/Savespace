appId: app.savespace.desktop
productName: Savespace
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: src/main/db/migrations
    to: migrations
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  # Bundled local-AI engine (Ollama, MIT), fetched + SHA-256 verified by scripts/fetch-ollama.mjs
  - from: resources/ollama
    to: ollama
  # Apple on-device AI bridge (built from native/apple-ai/main.swift by scripts/build-apple-ai.mjs)
  - from: resources/apple-ai
    to: apple-ai
asarUnpack:
  - '**/*.node'
npmRebuild: false
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.png
  minimumSystemVersion: '15.0'
  # Hardened runtime needs a Developer ID signature; with an ad-hoc signature it blocks the app's own frameworks.
  # Set to true together with a real identity (see SETUP_GUIDE.md step 11.2).
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # "-" = ad-hoc signature: free, no Apple account. It seals the whole app so macOS doesn't call the
  # download "damaged". (Without a Developer ID it's still unverified: users click Open Anyway once.)
  # For a real signature, set this to your "Developer ID Application: …" name (SETUP_GUIDE.md, step 11.2).
  identity: '-'
  notarize: false
  extendInfo:
    NSAppleEventsUsageDescription: Savespace asks your apps which files, tabs and drafts are open (read-only) so it can reopen them later. It never changes anything in them.
    LSApplicationCategoryType: public.app-category.productivity
dmg:
  title: Savespace ${version}
  # Fixed name so the website can always link to releases/latest/download/Savespace-arm64.dmg
  artifactName: Savespace-${arch}.dmg
